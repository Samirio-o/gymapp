<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${workoutPlan.name}">Workout plan</title>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js">
    </script>

    <link rel="stylesheet" th:href="@{/css/gym.css}">
    <link rel="stylesheet" th:href="@{/css/calendar.css}">

</head>

<body>
    <h1 th:text="${workoutPlan.name}">Workout plan</h1>

    <p>
        Muscle group:
        <span th:text="${#strings.capitalize(workoutPlan.muscleGroup)}">
            Muscle group
        </span>
    </p>

    <h2>Exercises</h2>

    <a th:href="@{/workout-plans/{id}/exercises/new(id=${workoutPlan.id})}">
        Add exercise
    </a>

    <ul>
        <li th:each="exercise : ${exercises}">
            <strong th:text="${exercise.name}">Exercise name</strong>
            -
            <span th:text="${exercise.sets}">0</span> sets,
            <span th:text="${exercise.repetitions}">0</span> repetitions,
            <span th:text="${exercise.restTime}">0</span> seconds rest

            <a th:href="@{/exercises/{id}/edit(id=${exercise.id})}">
                Edit
            </a>

            <form th:action="@{/exercises/{id}/delete(id=${exercise.id})}" method="post" style="display: inline;">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <button type="submit">Delete</button>
            </form>
        </li>
    </ul>

    <h2>Workout diary</h2>

    <form th:action="@{/workout-plans/{id}/logs(id=${workoutPlan.id})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit">Mark as completed today</button>
    </form>

    <div id="calendar"></div>

    <!-- Thymeleaf renders completed dates for calendar.js. -->
    <div id="workout-dates">
        <span th:each="log : ${workoutLogs}" class="workout-date" th:data-date="${log.workoutDate}">
        </span>
    </div>

    <script th:src="@{/js/calendar.js}"></script>

    <p th:if="${#lists.isEmpty(workoutLogs)}">
        No completed workouts yet.
    </p>

    <p th:if="${#lists.isEmpty(exercises)}">
        This workout plan has no exercises yet.
    </p>

    <a href="/">Back to home</a>
</body>

</html>
