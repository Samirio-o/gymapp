<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Register - GymApp</title>
</head>

<body>
    <h1>Create an account</h1>

    <div th:if="${param.error}">
        Username or email already exists.
    </div>

    <div th:if="${param.success}">
        Registration completed successfully.
    </div>

    <form th:action="@{/register}" th:object="${registrationForm}" method="post">

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <label>
            Username:
            <input type="text" th:field="*{username}">
            <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}">
            </div>
        </label>
        <br>

        <label>
            Email:
            <input type="email" th:field="*{email}">
            <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
            </div>
        </label>
        <br>

        <label>
            Password:
            <input type="password" th:field="*{password}">
            <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}">
            </div>
        </label>
        <br>

        <label>
            Confirm password:
            <input type="password" th:field="*{confirmPassword}">
            <div th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">
            </div>
        </label>
        <br>

        <button type="submit">Register</button>
        <div th:if="${#fields.hasGlobalErrors()}">
            <p th:each="error : ${#fields.globalErrors()}" th:text="${error.defaultMessage}">
            </p>
        </div>
    </form>

    <a href="/login">Back to login</a>
</body>

</html>
