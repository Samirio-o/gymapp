<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>GymApp</title>
    <link rel="stylesheet" th:href="@{/css/gym.css}">
</head>

<body>

    <h1>My Workout Plans</h1>
    <a href="/workout-plans/new">Create a new workout plan</a>

    <ul>
        <li th:each="workoutPlan : ${workoutPlans}">
            <a th:href="@{/workout-plans/{id}(id=${workoutPlan.id})}" th:text="${workoutPlan.name}">
                Workout name
            </a>
            -
            <span th:text="${#strings.capitalize(workoutPlan.muscleGroup)}">
                Muscle group
            </span>

            <a th:href="@{/workout-plans/{id}/edit(id=${workoutPlan.id})}">
                Edit
            </a>

            <form th:action="@{/workout-plans/{id}/delete(id=${workoutPlan.id})}"
                  method="post"
                  style="display: inline;">
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">
                <button type="submit"
                        onclick="return confirm('Delete this workout plan and all its exercises and diary entries?');">
                    Delete
                </button>
            </form>
        </li>
    </ul>

    <p th:if="${#lists.isEmpty(workoutPlans)}">
        You do not have any workout plans yet.
    </p>

    <form th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit">Logout</button>
    </form>
</body>

</html>
