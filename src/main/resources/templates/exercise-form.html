<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Add Exercise - GymApp</title>
    <link rel="stylesheet" th:href="@{/css/gym.css}">
</head>

<body>
    <h1>Add exercise</h1>

    <p>
        Workout plan:
        <span th:text="${workoutPlan.name}">Workout plan</span>
    </p>

    <form th:action="@{/workout-plans/{id}/exercises(id=${workoutPlan.id})}" method="post">

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <label>
            Exercise name:
            <input type="text" name="name" required>
        </label>
        <br>

        <label>
            Sets:
            <input type="number" name="sets" min="1" required>
        </label>
        <br>

        <label>
            Repetitions:
            <input type="number" name="repetitions" min="1" required>
        </label>
        <br>

        <label>
            Rest in seconds:
            <input type="number" name="restTime" min="0" required>
        </label>
        <br>

        <button type="submit">Add exercise</button>
    </form>

    <a th:href="@{/workout-plans/{id}(id=${workoutPlan.id})}">
        Back to workout plan
    </a>
</body>

</html>
