<h1 th:text="${#strings.capitalize(muscleGroup)}">Muscle group</h1>

<ul>
    <li th:each="exercise : ${exercises}">
        <a th:href="@{/exercises/{id}(id=${exercise.id})}"
           th:text="${exercise.name}">
            Exercise name
        </a>

        <span th:text="${exercise.sets}">0</span> sets,
        <span th:text="${exercise.repetitions}">0</span> repetitions,
        <span th:text="${exercise.restTime}">0</span> seconds rest
    </li>
</ul>

<a href="/">Back to home</a>
